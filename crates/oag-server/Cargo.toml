[package]
name = "oag-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oag-core.workspace = true
oag-pool.workspace = true
oag-proto.workspace = true
oag-router.workspace = true
oag-store.workspace = true
oag-upstream.workspace = true
axum.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
reqwest.workspace = true
rust_decimal.workspace = true
sqlx.workspace = true
time.workspace = true
uuid.workspace = true
url.workspace = true
bytes = "1"
# The connection builder `axum::serve` hides. Without it `server.header_read_timeout`
# and `server.idle_timeout` cannot be applied at all.
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
futures-util.workspace = true
tokio-stream = "0.1"
async-trait.workspace = true

[dev-dependencies]
# For the error-shape catalogue test: `every_variant()` is feature-gated.
oag-core = { workspace = true, features = ["test-fixtures"] }
base64.workspace = true
http-body-util.workspace = true

[lints]
workspace = true
