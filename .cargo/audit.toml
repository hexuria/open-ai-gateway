# `cargo audit` reads this. Every ignore here must say why the advisory does
# not apply, and must be re-checked when the dependency it names moves.
#
# None today. RUSTSEC-2026-0235 (rkyv 0.7) was ignored here because
# rust_decimal 1.42 recorded rkyv as an optional dependency in Cargo.lock;
# rust_decimal 1.43 dropped it, and rkyv is no longer in the lockfile at all.
[advisories]
ignore = []
