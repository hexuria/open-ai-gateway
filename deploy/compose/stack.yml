# The full three-tier topology: edge -> load balancer -> N gateway replicas.
#
# This is the thing to run when you want to see how the tiers actually compose,
# and the thing the streaming and rolling-restart tests drive.
name: oag-stack

x-gateway: &gateway
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
  environment: &gateway-env
    OAG_DATABASE__URL: postgres://oag:oag@postgres:5432/oag
    OAG_REDIS__URL: redis://redis:6379
    # Identical across every replica, and supplied from outside.
    #
    # This is the multi-replica correctness requirement: sub2api generates its
    # signing secret per instance when the environment does not supply one, so
    # replica A mints admin tokens replica B rejects. We refuse to boot without
    # it rather than generating one. See crates/oag-core/src/config.rs.
    OAG_SECURITY__SIGNING_SECRET: ${OAG_SIGNING_SECRET:?set OAG_SIGNING_SECRET, e.g. openssl rand -base64 48}
    OAG_SECURITY__CREDENTIAL_KEK: ${OAG_CREDENTIAL_KEK:?set OAG_CREDENTIAL_KEK, e.g. openssl rand -base64 32}
    OAG_SERVER__ADMIN_ADDR: 0.0.0.0:8081
    OAG_TELEMETRY__LOG_JSON: "true"
    # Override a provider's endpoint. Set here so the stack can be driven
    # against a mock; unset in a real deployment to use the public API.
    OAG_GATEWAY__PROVIDER_BASE_URLS__ANTHROPIC: ${OAG_ANTHROPIC_BASE_URL:-https://api.anthropic.com}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  # Must exceed gateway.max_stream_duration, or a rolling restart severs
  # in-flight streams — which is exactly what sub2api's hardcoded 5-second
  # shutdown does on every deploy.
  stop_grace_period: 1830s
  restart: unless-stopped

services:
  # Migrations run once, in their own container, before any replica starts.
  #
  # The alternative — having one replica migrate on boot — needs that replica
  # to run two commands, which fights the image's entrypoint, and makes the
  # ordering implicit. `service_completed_successfully` states it outright.
  #
  # The advisory lock inside `oag migrate` means this stays safe even if
  # several stacks come up against one database at the same time.
  migrate:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    command: ["migrate"]
    environment:
      OAG_DATABASE__URL: postgres://oag:oag@postgres:5432/oag
      OAG_REDIS__URL: redis://redis:6379
      OAG_SECURITY__SIGNING_SECRET: ${OAG_SIGNING_SECRET:?set OAG_SIGNING_SECRET, e.g. openssl rand -base64 48}
      OAG_SECURITY__CREDENTIAL_KEK: ${OAG_CREDENTIAL_KEK:?set OAG_CREDENTIAL_KEK, e.g. openssl rand -base64 32}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  caddy:
    image: caddy:2-alpine
    depends_on: [envoy]
    ports: ["443:443", "80:80"]
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  envoy:
    image: envoyproxy/envoy:v1.34-latest
    depends_on: [oag-1, oag-2, oag-3]
    volumes:
      - ../envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "oag-lb"]

  # `command` here is arguments to the image's entrypoint (`oag`), not a
  # replacement for it — so it is the subcommand alone.
  oag-1:
    <<: *gateway
    command: ["serve"]
    # The admin listener, published to loopback only so an operator can reach
    # the dashboard from the host. Never bind this to 0.0.0.0: the admin API
    # authenticates, but it has no business being reachable off the machine.
    ports: ["127.0.0.1:8081:8081"]

  oag-2:
    <<: *gateway
    command: ["serve"]

  oag-3:
    <<: *gateway
    command: ["serve"]

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: oag
      POSTGRES_PASSWORD: oag
      POSTGRES_DB: oag
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oag -d oag"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Single mount at /var/lib/postgresql, not .../data — Postgres 18 places
    # the cluster in a version subdirectory beneath it so pg_upgrade --link can
    # work without crossing a mount boundary.
    volumes: [pgdata:/var/lib/postgresql]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [redisdata:/data]

  # ── observability ───────────────────────────────────────────────────────────
  # Behind a profile, so the default stack stays small. Bring it up with:
  #   docker compose -f deploy/compose/stack.yml --profile observability up -d
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
  redisdata:
  caddy_data:
  promdata:
