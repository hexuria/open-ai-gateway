# L7 load balancer tier.
#
# Envoy earns its place over "just point Caddy at three upstreams" for three
# things Caddy does not do well: least-request balancing, outlier ejection, and
# draining that respects long-lived streams.
#
# Every timeout below is set explicitly. Envoy's defaults are tuned for ordinary
# request/response traffic and three of them will sever a streaming completion.

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: inference
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: inference
                # DEFAULT IS 5 MINUTES AND IT WILL KILL YOUR STREAMS.
                # 0s disables it; the gateway's own idle watchdog decides when a
                # stream is dead, and it can tell "thinking" from "gone".
                stream_idle_timeout: 0s
                # Whole-request deadline. Also disabled, same reason.
                request_timeout: 0s
                common_http_protocol_options:
                  idle_timeout: 300s
                http2_protocol_options:
                  # Generous windows: streams are long and chatty.
                  initial_stream_window_size: 1048576
                  initial_connection_window_size: 10485760
                route_config:
                  name: local
                  virtual_hosts:
                    - name: gateway
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: oag_gateway
                            # DEFAULT IS 15 SECONDS. This is the single most
                            # common cause of "my LLM proxy works locally and
                            # 504s in production".
                            timeout: 0s
                            idle_timeout: 0s
                            retry_policy:
                              # Only retry what is provably safe to retry: a
                              # connection that never established. Retrying a
                              # request the upstream may have already started
                              # would double-bill it.
                              retry_on: "connect-failure,refused-stream"
                              num_retries: 2
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: oag_gateway
      connect_timeout: 5s
      type: STRICT_DNS
      # LEAST_REQUEST, never ROUND_ROBIN.
      #
      # Completions vary by two orders of magnitude in duration. Round-robin
      # distributes *arrivals* evenly, which distributes *load* very unevenly:
      # one replica ends up holding every long stream while its neighbours idle.
      # sub2api's bundled config ships round_robin.
      lb_policy: LEAST_REQUEST
      least_request_lb_config:
        # Sample more hosts than the default two before choosing, since the
        # variance in stream duration makes a two-sample estimate noisy.
        choice_count: 3
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: oag_gateway
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: oag-1, port_value: 8080 } } }
              - endpoint: { address: { socket_address: { address: oag-2, port_value: 8080 } } }
              - endpoint: { address: { socket_address: { address: oag-3, port_value: 8080 } } }
      health_checks:
        - timeout: 3s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 2
          http_health_check:
            # /health/ready, not /health/live: readiness checks that Postgres
            # and Redis are actually reachable. A replica whose database
            # connection died still answers /health/live perfectly well, and
            # balancing onto it just spreads the failure around.
            path: "/health/ready"
      outlier_detection:
        # Eject a replica that starts returning 5xx even while its health check
        # passes — the failure mode health checks miss.
        consecutive_5xx: 5
        base_ejection_time: 30s
        max_ejection_percent: 34
        interval: 10s
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            # High, because these are long-lived streams rather than fast
            # request/response pairs; the gateway does its own admission
            # control per credential.
            max_connections: 4096
            max_pending_requests: 1024
            max_requests: 4096
