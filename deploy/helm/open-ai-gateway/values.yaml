# open-ai-gateway
#
# Runs on any conformant Kubernetes: GKE, EKS, AKS, or your own. Nothing here is
# cloud-specific except the ingress annotations, which you set per platform.

image:
  repository: ghcr.io/hexuria/open-ai-gateway
  # Defaults to .Chart.AppVersion, which is "0.1.0" — and a `0.1.0` image
  # exists only once a `v0.1.0` git tag has been pushed, because the release
  # workflow publishes semver on `v*` and nothing else does. Until then the
  # documented install lands on ImagePullBackOff. Set this to `main`, or to a
  # `sha-<full sha>` tag for anything you intend to keep.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 3

# ── data tier ─────────────────────────────────────────────────────────────────
# Three shapes, one interface. `external` covers both cloud-managed services
# (Cloud SQL, RDS, Azure Database) and cloud-neutral ones (Neon, Upstash) —
# from the gateway's point of view they are the same thing: a URL.
data:
  mode: external          # external | inCluster

  external:
    # Supply these through existingSecret in anything real. The inline values
    # exist so `helm install` works for a first look, and only for that.
    databaseUrl: ""
    redisUrl: ""
    # A secret with keys: OAG_DATABASE__URL, OAG_REDIS__URL
    existingSecret: ""

  # Postgres and Redis as StatefulSets in the same cluster.
  #
  # Honest about what this is: fine for a dev cluster or a small internal
  # deployment, and NOT a substitute for an operator in production. This chart
  # gives you a single instance with a PVC — no failover, no point-in-time
  # recovery, no connection pooling. For production self-hosting, run
  # CloudNativePG for Postgres and set data.mode=external to point at it.
  inCluster:
    postgres:
      image: postgres:18-alpine
      storage: 20Gi
      storageClass: ""
      resources:
        requests: { cpu: 250m, memory: 512Mi }
        limits:   { memory: 2Gi }
    redis:
      image: redis:8-alpine
      storage: 8Gi
      storageClass: ""
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { memory: 1Gi }

# ── secrets ───────────────────────────────────────────────────────────────────
# Both are REQUIRED and must be byte-identical across every replica. The gateway
# refuses to start without them, and refuses anything that looks like a
# placeholder. Generate with:
#   openssl rand -base64 48   # signingSecret
#   openssl rand -base64 32   # credentialKek
security:
  signingSecret: ""
  credentialKek: ""
  # A secret with keys: OAG_SECURITY__SIGNING_SECRET, OAG_SECURITY__CREDENTIAL_KEK
  # Prefer this, wired to External Secrets / Secrets Store CSI.
  existingSecret: ""

# ── gateway behaviour ─────────────────────────────────────────────────────────
gateway:
  # Ceiling on one stream, and the shutdown drain budget.
  # terminationGracePeriodSeconds MUST exceed this — the chart refuses to render
  # otherwise, because a shorter grace period severs live streams on every
  # rolling update and the failure looks like a random upstream error.
  maxStreamDurationSeconds: 1800
  streamIdleTimeoutSeconds: 180
  streamKeepaliveIntervalSeconds: 10
  # How long an upstream may take to send response headers, and how long a
  # client may go without reading its stream. Both are backstops against
  # silence, not latency targets.
  upstreamResponseTimeoutSeconds: 90
  clientWriteTimeoutSeconds: 60
  sameAccountRetries: 2
  maxAccountSwitches: 3
  catalogRefreshIntervalSeconds: 60
  # How often the monthly spend counters are checked against the ledger. A
  # backstop for the rolling-deploy window, off the request path; 0 disables.
  spendReconcileIntervalSeconds: 600

  # How long failover may keep trying credentials for one request. Zero is
  # refused by the gateway rather than meaning "no deadline"; see its config.
  failoverBudgetSeconds: 120

  # How often seat quotas are polled. The reserve every seat is held back by is
  # evaluated against the figure this refreshes, so zero is refused too.
  usagePollIntervalSeconds: 300
  bedrockRegion: us-east-1
  # provider -> base URL. Leave empty to use each provider's public API.
  providerBaseUrls: {}

telemetry:
  logFilter: info
  logJson: true
  # No otlpEndpoint: this build links no OTLP exporter, and the gateway now
  # refuses to boot if one is configured rather than pretending to export.
  # Metrics are on /metrics; logs are structured JSON.

# ── listeners ─────────────────────────────────────────────────────────────────
# Two by default: 8080 inference, 8081 admin. On Kubernetes there is no reason
# to collapse them — a Service can expose both, and keeping the admin API off
# the internet-facing one is free.
service:
  type: ClusterIP
  publicPort: 8080
  adminPort: 8081
  annotations: {}

# The admin port carries the dashboard, /metrics and /health/ready, and three
# of its routes sit outside the admin-key layer by design. On a Service with
# no policy, "internal network only" meant "every pod in the cluster". This
# keeps the public port reachable from anywhere (the ingress controller lives
# elsewhere) and the admin port reachable only from this namespace, plus
# whatever `adminFrom` adds — a monitoring namespace's Prometheus, typically.
# A CNI that does not enforce NetworkPolicy ignores this object harmlessly.
networkPolicy:
  enabled: true
  # Extra `from` entries for the admin port, in NetworkPolicy peer syntax.
  adminFrom: []
  #  - namespaceSelector:
  #      matchLabels: { kubernetes.io/metadata.name: monitoring }

# ── scheduling ────────────────────────────────────────────────────────────────
terminationGracePeriodSeconds: 1845

# Seconds to wait after Kubernetes decides to stop a pod, before the process is
# told to shut down.
#
# This closes a race that is invisible until you look for it. On SIGTERM the
# gateway stops accepting new connections immediately — correct behaviour. But
# removing a pod from a Service is not instantaneous: every kube-proxy has to
# observe the endpoint change and rewrite its rules, which takes seconds. In
# that window the pod is refusing connections that the cluster is still sending
# it, and every one of them is a failed request during an ordinary deploy.
#
# Sleeping here delays SIGTERM so the endpoint is gone everywhere first. The pod
# keeps serving normally throughout.
preStopDelaySeconds: 15

server:
  # Requests admitted per replica at once; past this a request is shed with a
  # 503 and a Retry-After, never queued. `OagReplicaShedding` tells you to
  # raise this — which is only possible if the chart can set it. Sized with
  # `resources.limits.memory`: see the note there.
  maxInFlight: 64

  # The largest request body accepted, in bytes. `OagReplicaShedding` names this
  # too: a fleet shedding on memory rather than on concurrency is usually taking
  # bodies larger than it was sized for.
  #
  # 32 MiB, which is the gateway's own default — a chart key that quietly
  # changed a default would be worse than no key at all.
  maxBodyBytes: 33554432

database:
  # Ceiling on any one statement. A held query on a stalled primary is turned
  # into an error the pool recovers from.
  statementTimeoutSeconds: 30

resources:
  # `server.max_body_bytes` is buffered per in-flight request, and
  # `server.maxInFlight` above bounds how many are. Their product is what an
  # all-maximum-size flood could hold — 64 × 32 MiB at the defaults, more than
  # this limit, which is survivable only because real bodies are kilobytes.
  # Raise the three together, or lower the ceiling for a large-body workload.
  requests: { cpu: 200m, memory: 256Mi }
  limits:   { memory: 1Gi }

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  # Scale-down is deliberately slow: every terminating pod holds live streams
  # for up to the drain budget, so thrashing costs far more than a spare pod.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300

podDisruptionBudget:
  enabled: true
  minAvailable: 2

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podAnnotations: {}
podLabels: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# ── migrations ────────────────────────────────────────────────────────────────
# A pre-install/pre-upgrade hook. `oag migrate` takes a Postgres advisory lock,
# so running it twice, or from two releases at once, is safe.
migrations:
  enabled: true
  backoffLimit: 3

# ── ingress ───────────────────────────────────────────────────────────────────
# Only the inference port. The admin port is never routed from an ingress.
#
# The annotations below are the ones that matter for streaming, per controller.
# Getting them wrong does not fail loudly — it buffers, and the client sees
# nothing for two minutes and then everything at once.
ingress:
  enabled: false
  className: ""
  host: ""
  tls: []
  annotations: {}
    # nginx:
    #   nginx.ingress.kubernetes.io/proxy-buffering: "off"
    #   nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    #   nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    # GKE ingress: use a BackendConfig with timeoutSec: 1800
    # AWS ALB:  alb.ingress.kubernetes.io/load-balancer-attributes:
    #             idle_timeout.timeout_seconds=1800
    #           alb.ingress.kubernetes.io/target-group-attributes:
    #             load_balancing.algorithm.type=least_outstanding_requests

# Prometheus Operator ServiceMonitor. Scrapes the admin port.
serviceMonitor:
  enabled: false
  interval: 15s
  labels: {}


# The alert rules, as a PrometheusRule.
#
# `deploy/prometheus/alerts.yml` holds the same rules for a standalone
# Prometheus. On Kubernetes there was no way to get them: the chart shipped a
# ServiceMonitor, so metrics were scraped and nothing was ever paged on, and an
# operator following the runbooks found the alerts they name do not exist.
#
# Off by default, like the ServiceMonitor beside it: both need the Prometheus
# Operator's CRDs, and a chart that fails to install on a cluster without them
# would be worse than one that ships no rules.
prometheusRule:
  enabled: false
  # Whatever label your Prometheus selects rules by — commonly
  # `release: kube-prometheus-stack`.
  labels: {}

# Any other configuration key, for the settings this chart has no key of its own
# for.
#
# The gateway reads its whole configuration from `OAG_*` environment variables,
# and the chart names fourteen of them. The rest — the `gateway.codex` block,
# `claude_code_model_aliases`, anything added after this chart was last touched
# — had no route in at all, which made a runbook step that says "raise
# server.max_body_bytes" impossible to follow.
#
# Rendered after the named keys, so it can override them as well as add to them.
# An operator who needs a value the chart spells differently should not have to
# wait for a chart release.
#
#   extraEnv:
#     OAG_GATEWAY__CODEX__USER_AGENT: "my-org/1.0"
#     OAG_SERVER__MAX_BODY_BYTES: "67108864"
extraEnv: {}
