{{- include "oag.validate" . -}}
{{- if not .Values.security.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oag.fullname" . }}-security
  labels: {{- include "oag.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
type: Opaque
stringData:
  OAG_SECURITY__SIGNING_SECRET: {{ .Values.security.signingSecret | quote }}
  OAG_SECURITY__CREDENTIAL_KEK: {{ .Values.security.credentialKek | quote }}
{{- end }}
{{- if or (eq .Values.data.mode "inCluster") (not .Values.data.external.existingSecret) }}
---
{{- $name := printf "%s-data" (include "oag.fullname" .) }}
{{- $prior := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "oag.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
type: Opaque
stringData:
{{- if eq .Values.data.mode "inCluster" }}
  {{- /*
      Generate the password once and reuse it on every upgrade. Regenerating it
      would leave the running Postgres with the old password and every gateway
      pod unable to connect — a failure that looks like a database outage rather
      than a chart bug.
  */}}
  {{- $pw := "" }}
  {{- if and $prior (index $prior.data "POSTGRES_PASSWORD") }}
  {{- $pw = index $prior.data "POSTGRES_PASSWORD" | b64dec }}
  {{- else }}
  {{- $pw = randAlphaNum 32 }}
  {{- end }}
  POSTGRES_PASSWORD: {{ $pw | quote }}
  OAG_DATABASE__URL: {{ printf "postgres://oag:%s@%s-postgres:5432/oag" $pw (include "oag.fullname" .) | quote }}
  OAG_REDIS__URL: {{ printf "redis://%s-redis:6379" (include "oag.fullname" .) | quote }}
{{- else }}
  OAG_DATABASE__URL: {{ .Values.data.external.databaseUrl | quote }}
  OAG_REDIS__URL: {{ .Values.data.external.redisUrl | quote }}
{{- end }}
{{- end }}
