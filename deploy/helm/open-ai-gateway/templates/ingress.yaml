{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "oag.fullname" . }}
  labels: {{- include "oag.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          # Only the inference port. The admin port is deliberately absent: it
          # is reachable in-cluster through the Service and nowhere else.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "oag.fullname" . }}
                port:
                  name: public
{{- end }}
