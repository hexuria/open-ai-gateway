{{- if eq .Values.data.mode "inCluster" }}
{{- /*
The in-cluster data tier: Postgres and Redis, for a demo or a single-node
install. Neither is a hook, and that is the fix rather than an omission.

All four resources here carried `helm.sh/hook: pre-install,pre-upgrade`. Helm's
default hook deletion policy is `before-hook-creation`, so every `helm upgrade`
DELETED and recreated both StatefulSets — and their Services — before the new
gateway pods existed. The fleet lost its database and its cache for the twenty
to forty seconds that took, failing in-flight ledger writes, on an upgrade that
reported success and left nothing behind to explain the gap.

A StatefulSet holding a database is not a hook. It is ordinary state to be
applied and then updated in place, which is what Helm does with an unannotated
resource. The ordering the hook weight was buying is already handled by the
gateway's init container, which waits for Postgres to accept connections before
the gateway starts.

`helm.sh/resource-policy: keep` in their place, so `helm uninstall` does not
take the data with it. That is a deliberate second decision: an uninstall that
silently destroys a database is the other half of this failure, and a kept
PersistentVolumeClaim is recoverable where a deleted one is not.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oag.fullname" . }}-postgres
  labels: {{- include "oag.labels" . | nindent 4 }}
  annotations:
    # No `helm.sh/hook`. See the note at the top of this file.
    "helm.sh/resource-policy": keep
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "oag.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oag.fullname" . }}-postgres
  labels: {{- include "oag.labels" . | nindent 4 }}
  annotations:
    # No `helm.sh/hook`. See the note at the top of this file.
    "helm.sh/resource-policy": keep
spec:
  serviceName: {{ include "oag.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "oag.name" . }}-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "oag.name" . }}-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.data.inCluster.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: oag
            - name: POSTGRES_DB
              value: oag
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "oag.fullname" . }}-data
                  key: POSTGRES_PASSWORD
            # Postgres 18 places the cluster in a version subdirectory beneath
            # the mount, so the volume goes at /var/lib/postgresql and not
            # .../data — which is correct for 17 and earlier and makes 18
            # refuse to start.
            - name: PGDATA
              value: /var/lib/postgresql/pgdata
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "oag", "-d", "oag"] }
            periodSeconds: 5
          resources: {{- toYaml .Values.data.inCluster.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.data.inCluster.postgres.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.data.inCluster.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oag.fullname" . }}-redis
  labels: {{- include "oag.labels" . | nindent 4 }}
  annotations:
    # No `helm.sh/hook`. See the note at the top of this file.
    "helm.sh/resource-policy": keep
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "oag.name" . }}-redis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{ name: redis, port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oag.fullname" . }}-redis
  labels: {{- include "oag.labels" . | nindent 4 }}
  annotations:
    # No `helm.sh/hook`. See the note at the top of this file.
    "helm.sh/resource-policy": keep
spec:
  serviceName: {{ include "oag.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "oag.name" . }}-redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "oag.name" . }}-redis
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.data.inCluster.redis.image }}
          # Everything the gateway keeps in Redis is expendable — slots, session
          # pins, the auth cache — so an appendonly file buys little. It is on
          # anyway so a restart does not dump every conversation off its pinned
          # credential at once.
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources: {{- toYaml .Values.data.inCluster.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.data.inCluster.redis.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.data.inCluster.redis.storage }}
{{- end }}
