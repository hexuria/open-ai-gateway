[workspace]
resolver = "3"
members = [
    "crates/oag-core",
    "crates/oag-router",
    "crates/oag-proto",
    "crates/oag-upstream",
    "crates/oag-pool",
    "crates/oag-store",
    "crates/oag-server",
    "crates/oag",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = ""
publish = false

[workspace.dependencies]
oag-core = { path = "crates/oag-core" }
oag-router = { path = "crates/oag-router" }
oag-proto = { path = "crates/oag-proto" }
oag-upstream = { path = "crates/oag-upstream" }
oag-pool = { path = "crates/oag-pool" }
oag-store = { path = "crates/oag-store" }
oag-server = { path = "crates/oag-server" }

# ── async runtime and HTTP server ──────────────────────────────────────────────
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util", "limit", "load-shed"] }
tower-http = { version = "0.7", features = ["catch-panic", "trace", "limit", "request-id", "timeout"] }
http = "1"
http-body-util = "0.1"

# ── upstream HTTP client ───────────────────────────────────────────────────────
# rustls only. No OpenSSL, no BoringSSL: see docs/03-providers.md §Transport.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "stream",
    "json",
    "charset",
] }

# ── persistence ────────────────────────────────────────────────────────────────
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "uuid",
    "time",
    "json",
    "rust_decimal",
    "runtime-tokio",
    "tls-rustls-ring",
    "migrate",
    "macros",
] }
redis = { version = "1", default-features = false, features = [
    "tokio-rustls-comp",
    "connection-manager",
    "script",
] }
moka = { version = "0.12", features = ["future"] }

# ── serialisation and core types ───────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
# `raw_value`: the System One route renames a request's model and copies every
# other member as the bytes it arrived in.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
serde_yaml_ng = "0.10"
thiserror = "2"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# v5 for the usage importer: an imported row's primary key is derived from the
# external record's identity, so a re-import collides instead of duplicating.
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
time = { version = "0.3", features = ["serde-well-known", "macros"] }
url = "2"
# Money is never f64. Every cost in this system is a Decimal.
rust_decimal = { version = "1", features = ["serde-with-float", "macros"] }

# ── credential sealing ─────────────────────────────────────────────────────────
sha2 = "0.11"
# SigV4 for Bedrock. HMAC-SHA256 over a canonical request — a few dozen lines
# against the AWS SDK's several hundred crates, none of which we would use for
# anything else.
hmac = "0.13"
hex = "0.4"
# `zeroize`: the cipher wipes its copy of the KEK when dropped. 0.10 always
# did; 0.11 does only with this feature, and a test in `oag-core/src/seal.rs`
# does not compile without it. No `getrandom`: the nonce comes from `rand`.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }
rand = "0.10"
base64 = "0.23"
# RS256 for the JWT a Google service account signs to get an access token
# (`oag-upstream/src/gcp_token.rs`). Already in the tree as rustls' crypto
# provider; named here at the version the lockfile holds, so no crate is added.
ring = "0.17.14"

# ── observability ──────────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
# No default features: we render /metrics from our own admin router rather than
# letting the exporter bind a third listener we would then have to secure.
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# ── cli ────────────────────────────────────────────────────────────────────────
clap = { version = "4", features = ["derive", "env"] }

# ── System One (Jev) ───────────────────────────────────────────────────────────
# The owner's SDK, for its wire types in both directions: the gateway parses a
# client's request and Jev's answer with the same types the client serialises
# them with, rather than keeping a second copy of the format. Pinned exactly: the
# gateway re-serves its wire types byte for byte.
typesafe-sdk = "=0.2.0"

# ── tests only ─────────────────────────────────────────────────────────────────
# Stand-in upstreams for tests: a real HTTP server per test, so a request is
# checked as it arrived over the wire, headers and path included, and a mock can
# be told to expect no request at all. Nobody holds a key for most of the hosts
# these tests stand in for.
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -2 }
# Nothing in a gateway should take the process down. A panic in the request path
# is a 500 for every in-flight stream on that replica, not just the one request.
unwrap_used = "deny"
panic = "deny"
expect_used = "warn"
todo = "warn"
# Too noisy for a codebase this shape; re-enable case by case if it earns it.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# New in 1.99 (pedantic): wants `assert_eq!(x, [] as [T; 0])` for
# `assert!(x.is_empty())`, which reads worse and drops the message.
assert_is_empty = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
