# open-ai-gateway configuration.
#
# Every field can be overridden by an environment variable named
# OAG_<SECTION>__<FIELD> — double underscore for nesting. So:
#
#   OAG_DATABASE__URL=postgres://...
#   OAG_SERVER__PUBLIC_ADDR=0.0.0.0:8080
#
# That is how a container image ships one config file and lets the orchestrator
# inject secrets, which is the only way the signing secret can be identical
# across replicas without being committed to the repo.

server:
  # Inference only. This is what the load balancer fronts.
  public_addr: "0.0.0.0:8080"
  # Admin API, the SPA, /metrics, /health/ready. Keep this on the internal
  # network — the default binds to loopback so an accidental deployment does not
  # expose it.
  admin_addr: "127.0.0.1:8081"
  # How long a client may take to send its request headers. A trickle of header
  # bytes with no deadline is a slowloris.
  header_read_timeout: 10
  # How long an HTTP/2 connection may go quiet before it is pinged. Deliberately
  # NOT a response deadline: a streamed completion legitimately runs for many
  # minutes, and the ping is answered by the transport rather than the
  # application, so an idle-but-alive stream survives it.
  idle_timeout: 120
  # 32 MiB, buffered in memory per in-flight request. Raising this multiplies by
  # your concurrency: at 256 MiB, the previous default, a handful of concurrent
  # large POSTs exceeds the memory limit the Helm chart asks for.
  max_body_bytes: 33554432

database:
  url: "postgres://oag:oag@localhost:5432/oag"
  max_connections: 16

redis:
  url: "redis://localhost:6379"

security:
  # BOTH REQUIRED. The gateway refuses to start without them. The signing
  # secret is refused when it looks like a placeholder; the KEK is refused
  # unless it decodes to exactly 32 bytes, which is the only check it gets.
  #
  # They must be byte-identical across every replica. sub2api generates its
  # equivalents per instance when the environment does not supply them, so
  # replica A mints tokens replica B rejects — an intermittent auth failure
  # that looks like anything but a config problem.
  #
  # signing_secret also authenticates the auth cache in Redis, so an entry
  # planted there cannot pass for an identity. Changing it invalidates that
  # cache — safe, and costs one cold cache.
  #
  #   openssl rand -base64 48   # signing_secret
  #   openssl rand -base64 32   # credential_kek
  signing_secret: "REPLACE_ME"
  credential_kek: "REPLACE_ME"

gateway:
  # How long an upstream may send nothing before we call the stream dead and
  # fail over. Long enough to cover a model thinking, short enough to notice a
  # hung connection.
  stream_idle_timeout: 180
  # No-op events downstream, so intermediaries with their own idle timeouts do
  # not drop a legitimately quiet stream.
  stream_keepalive_interval: 10
  # Ceiling on one stream, and the shutdown drain budget. Your orchestrator's
  # grace period must be at least this long or a rolling deploy severs streams:
  # stop_grace_period in compose, terminationGracePeriodSeconds on Kubernetes.
  max_stream_duration: 1800
  same_account_retries: 2
  max_account_switches: 3
  # Codex/ChatGPT subscription adapter. Selected per-account when an OpenAI
  # OAuth seat (imported with `oag admin account add --from codex`) is leased.
  # The chatgpt.com backend validates `instructions` against the official
  # Codex client; a current copy of that string (gpt-5.5, from the installed
  # Codex/opencodex catalog) lives at deploy/codex-instructions.txt —
  # Apache-2.0, taken from the installed Codex/opencodex catalog. Keep it
  # updated when the Codex client version bumps. Left unset, the client's
  # own system prompt is passed through, which the backend will reject.
  # codex:
  #   instructions_path: deploy/codex-instructions.txt
  #   user_agent: "codex_cli_rs/0.147.0"
  # Advertise every model a second time under an `anthropic/`-prefixed id.
  # Claude Code's gateway model discovery caches /v1/models and then drops
  # every id that does not match /^(claude|anthropic)/i, so without this its
  # picker is empty on any route that is not serving Anthropic models. Off by
  # default because it doubles the listing for every other client. See
  # docs/03-providers.md.
  # claude_code_model_aliases: true

  # Advertise `oag/auto` in /v1/models. Off by default: the classifier behind it
  # picks a rung from the request's SHAPE (token count, tool count, turn count,
  # images, code) and never from what the task is, so the name promises a
  # judgement it does not make. The `oag/<rung>` pins are advertised either way
  # — they are a tier the caller named. Advertisement only: `oag/auto` stays
  # resolvable whichever way this points, so an existing pin keeps working.
  # advertise_auto: true

telemetry:
  log_filter: "info"
  log_json: false
  # otlp_endpoint: "http://tempo:4318"
